server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck for Kamal
    location = /up {
        access_log off;
        return 200 "OK";
    }

    # Support for Hugo clean URLs
    location / {
        try_files $uri $uri/ =404;
    }

    # Redirect /rss/ to /index.xml
    location = /rss/ {
        return 301 /index.xml;
    }

    location = /rss {
        return 301 /index.xml;
    }

    # Custom 404 page
    error_page 404 /404.html;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
